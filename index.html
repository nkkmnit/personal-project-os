<!DOCTYPE html>
<html lang="hi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Project OS - AI Work Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <!-- PWA Manifest Link -->
    <link rel="manifest" id="manifest-placeholder">
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col justify-between select-none">

    <!-- Top Header -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="bg-white/10 p-2 rounded-xl text-indigo-100">
                <i class="fa-solid fa-brain text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-wide leading-tight">Personal Project OS</h1>
                <p class="text-xs text-indigo-200">AI Work Management System</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openGlobalSearch()" class="p-2 rounded-full hover:bg-white/10 transition text-indigo-100" title="Search">
                <i class="fa-solid fa-magnifying-glass text-lg"></i>
            </button>
            <button onclick="switchTab('settings')" class="p-2 rounded-full hover:bg-white/10 transition text-indigo-100" title="Settings">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Content View Area -->
    <main id="app-content" class="flex-1 overflow-y-auto pb-24 p-4 max-w-4xl mx-auto w-full">
        <!-- Dynamic Tabs Loaded via JS -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bg-white border-t border-slate-200 fixed bottom-0 left-0 right-0 z-40 shadow-lg max-w-4xl mx-auto">
        <div class="grid grid-cols-5 h-16 text-center text-xs font-medium text-slate-500">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center justify-center space-y-1 transition text-indigo-600">
                <i class="fa-solid fa-house text-lg"></i>
                <span>Home</span>
            </button>
            <button onclick="switchTab('projects')" id="nav-projects" class="flex flex-col items-center justify-center space-y-1 transition hover:text-indigo-600">
                <i class="fa-solid fa-diagram-project text-lg"></i>
                <span>Projects</span>
            </button>
            <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center justify-center space-y-1 transition hover:text-indigo-600">
                <i class="fa-solid fa-list-check text-lg"></i>
                <span>Tasks</span>
            </button>
            <button onclick="switchTab('notes')" id="nav-notes" class="flex flex-col items-center justify-center space-y-1 transition hover:text-indigo-600">
                <i class="fa-solid fa-note-sticky text-lg"></i>
                <span>Notes</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center justify-center space-y-1 transition hover:text-indigo-600">
                <i class="fa-solid fa-sliders text-lg"></i>
                <span>Settings</span>
            </button>
        </div>
    </nav>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-16 right-4 left-4 z-50 flex flex-col space-y-2 pointer-events-none max-w-md mx-auto"></div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <!-- JavaScript Application Logic -->
    <script>
        const DB_NAME = "PersonalProjectOS_DB";
        const DB_VERSION = 1;
        let db = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (event) => reject(event.target.error);
                request.onsuccess = (event) => {
                    db = event.target.result;
                    resolve(db);
                };
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains('projects')) database.createObjectStore('projects', { keyPath: 'id' });
                    if (!database.objectStoreNames.contains('tasks')) database.createObjectStore('tasks', { keyPath: 'id' });
                    if (!database.objectStoreNames.contains('logs')) database.createObjectStore('logs', { keyPath: 'id' });
                    if (!database.objectStoreNames.contains('notes')) database.createObjectStore('notes', { keyPath: 'id' });
                };
            });
        }

        function dbGetAll(storeName) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readonly');
                const store = transaction.objectStore(storeName);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function dbPut(storeName, data) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.put(data);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function dbDelete(storeName, id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.delete(id);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        let currentTab = 'home';
        let appData = { projects: [], tasks: [], logs: [], notes: [] };
        let activeProjectIdForDetail = null;

        async function loadAppData() {
            try {
                appData.projects = await dbGetAll('projects');
                appData.tasks = await dbGetAll('tasks');
                appData.logs = await dbGetAll('logs');
                appData.notes = await dbGetAll('notes');
            } catch (err) {
                console.error("Error loading app data", err);
            }
        }

        async function switchTab(tabName, projectId = null) {
            currentTab = tabName;
            if (projectId) activeProjectIdForDetail = projectId;

            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('text-indigo-600', 'font-semibold');
                btn.classList.add('text-slate-500');
            });
            const activeNav = document.getElementById(`nav-${tabName}`);
            if (activeNav) {
                activeNav.classList.remove('text-slate-500');
                activeNav.classList.add('text-indigo-600', 'font-semibold');
            }

            await loadAppData();
            renderCurrentView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function refreshDataAndRender() {
            await loadAppData();
            renderCurrentView();
        }

        function renderCurrentView() {
            const container = document.getElementById('app-content');
            container.innerHTML = '';

            if (currentTab === 'home') container.innerHTML = renderHomeView();
            else if (currentTab === 'projects') container.innerHTML = renderProjectsView();
            else if (currentTab === 'project-detail') container.innerHTML = renderProjectDetailView(activeProjectIdForDetail);
            else if (currentTab === 'tasks') container.innerHTML = renderTasksView();
            else if (currentTab === 'notes') container.innerHTML = renderNotesView();
            else if (currentTab === 'settings') container.innerHTML = renderSettingsView();
        }

        function renderHomeView() {
            const projects = appData.projects;
            const tasks = appData.tasks;
            const todayStr = new Date().toISOString().split('T')[0];

            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-indigo-500 to-violet-600 rounded-2xl p-5 text-white shadow-lg">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="bg-white/20 text-xs px-2.5 py-1 rounded-full font-medium">नमस्ते सर! 🙏</span>
                                <h2 class="text-xl font-bold mt-2">Personal Project OS</h2>
                                <p class="text-xs text-indigo-100 mt-1">आपके सभी AI Tools, Web Apps और Government Projects एक ही जगह सुरक्षित।</p>
                            </div>
                            <div class="bg-white/10 p-3 rounded-2xl">
                                <i class="fa-solid fa-terminal text-2xl text-indigo-100"></i>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h3 class="text-sm font-bold text-slate-600 mb-3 uppercase tracking-wider">Quick Actions (त्वरित कार्य)</h3>
                        <div class="grid grid-cols-3 gap-2.5">
                            <button onclick="openProjectModal()" class="bg-white hover:bg-indigo-50 border border-slate-200 p-3 rounded-xl text-center shadow-sm transition flex flex-col items-center justify-center">
                                <div class="bg-indigo-100 text-indigo-600 w-10 h-10 rounded-full flex items-center justify-center mb-1.5"><i class="fa-solid fa-plus text-sm"></i></div>
                                <span class="text-xs font-medium text-slate-700">नया Project</span>
                            </button>
                            <button onclick="openTaskModal()" class="bg-white hover:bg-emerald-50 border border-slate-200 p-3 rounded-xl text-center shadow-sm transition flex flex-col items-center justify-center">
                                <div class="bg-emerald-100 text-emerald-600 w-10 h-10 rounded-full flex items-center justify-center mb-1.5"><i class="fa-solid fa-list-check text-sm"></i></div>
                                <span class="text-xs font-medium text-slate-700">नया Task</span>
                            </button>
                            <button onclick="openNoteModal()" class="bg-white hover:bg-amber-50 border border-slate-200 p-3 rounded-xl text-center shadow-sm transition flex flex-col items-center justify-center">
                                <div class="bg-amber-100 text-amber-600 w-10 h-10 rounded-full flex items-center justify-center mb-1.5"><i class="fa-solid fa-note-sticky text-sm"></i></div>
                                <span class="text-xs font-medium text-slate-700">Quick Note</span>
                            </button>
                        </div>
                    </div>

                    <div>
                        <h3 class="text-sm font-bold text-slate-600 mb-3 uppercase tracking-wider">Dashboard Overview</h3>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                            <div onclick="switchTab('projects')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm cursor-pointer">
                                <span class="text-xs text-slate-500 font-medium">Total Projects</span>
                                <div class="text-2xl font-bold text-slate-800 mt-1">${projects.length}</div>
                            </div>
                            <div onclick="switchTab('projects')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm cursor-pointer">
                                <span class="text-xs text-slate-500 font-medium">Active Projects</span>
                                <div class="text-2xl font-bold text-emerald-600 mt-1">${projects.filter(p => p.currentStatus === 'In Progress').length}</div>
                            </div>
                            <div onclick="switchTab('tasks')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm cursor-pointer">
                                <span class="text-xs text-slate-500 font-medium">Pending Tasks</span>
                                <div class="text-2xl font-bold text-blue-600 mt-1">${tasks.filter(t => t.status !== 'Completed').length}</div>
                            </div>
                            <div onclick="switchTab('tasks')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm cursor-pointer">
                                <span class="text-xs text-slate-500 font-medium">Completed Tasks</span>
                                <div class="text-2xl font-bold text-green-600 mt-1">${tasks.filter(t => t.status === 'Completed').length}</div>
                            </div>
                            <div onclick="switchTab('tasks')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm cursor-pointer">
                                <span class="text-xs text-slate-500 font-medium">Today's Tasks</span>
                                <div class="text-2xl font-bold text-amber-600 mt-1">${tasks.filter(t => t.dueDate === todayStr && t.status !== 'Completed').length}</div>
                            </div>
                            <div onclick="switchTab('tasks')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm cursor-pointer">
                                <span class="text-xs text-slate-500 font-medium">Overdue Tasks</span>
                                <div class="text-2xl font-bold text-rose-600 mt-1">${tasks.filter(t => t.dueDate && t.dueDate < todayStr && t.status !== 'Completed').length}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderProjectsView() {
            const projects = appData.projects;
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="text-lg font-bold text-slate-800">My Projects (${projects.length})</h2>
                            <p class="text-xs text-slate-500">सभी ऐप्स, वेबसाइट्स और एआई प्रोजेक्ट्स का रिकॉर्ड</p>
                        </div>
                        <button onclick="openProjectModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-2 rounded-xl font-semibold shadow-sm flex items-center space-x-1.5 transition">
                            <i class="fa-solid fa-plus"></i>
                            <span>नया Project</span>
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${projects.length === 0 ? `
                            <div class="col-span-full text-center py-12 bg-white rounded-2xl border border-slate-200 p-6">
                                <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
                                <h3 class="text-sm font-bold text-slate-700">कोई प्रोजेक्ट नहीं मिला</h3>
                                <button onclick="loadDemoData()" class="mt-4 bg-indigo-50 text-indigo-600 text-xs px-4 py-2 rounded-xl font-semibold hover:bg-indigo-100 transition">Sample Projects लोड करें</button>
                            </div>
                        ` : projects.map(p => renderProjectCard(p)).join('')}
                    </div>
                </div>
            `;
        }

        function renderProjectCard(p) {
            return `
                <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm hover:shadow-md transition space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-700">${p.currentStatus}</span>
                            <h3 onclick="switchTab('project-detail', '${p.id}')" class="text-base font-bold text-slate-800 mt-1 cursor-pointer hover:text-indigo-600">${p.name}</h3>
                            <p class="text-xs text-slate-500">${p.category}</p>
                        </div>
                        <div class="flex space-x-1">
                            <button onclick="openResumeModal('${p.id}')" class="bg-indigo-50 text-indigo-600 p-2 rounded-xl text-xs hover:bg-indigo-100" title="Resume Summary"><i class="fa-solid fa-play"></i></button>
                            <button onclick="openProjectModal('${p.id}')" class="bg-slate-50 text-slate-600 p-2 rounded-xl text-xs hover:bg-slate-100" title="Edit"><i class="fa-solid fa-pen"></i></button>
                        </div>
                    </div>

                    <p class="text-xs text-slate-600 line-clamp-2">${p.description || 'विवरण उपलब्ध नहीं।'}</p>

                    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-[11px] grid grid-cols-2 gap-2 text-slate-700">
                        <div><strong>Prompt:</strong> ${p.promptTool || 'N/A'}</div>
                        <div><strong>Code:</strong> ${p.codeTool || 'N/A'}</div>
                        <div><strong>Host:</strong> ${p.hostPlatform || 'N/A'}</div>
                        <div><strong>GitHub ID:</strong> ${p.githubId || 'N/A'}</div>
                    </div>

                    <div>
                        <div class="flex justify-between text-[10px] text-slate-500 mb-1 font-medium">
                            <span>Progress</span>
                            <span>${p.completionPercentage || 0}%</span>
                        </div>
                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                            <div class="bg-indigo-600 h-full rounded-full" style="width: ${p.completionPercentage || 0}%"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderProjectDetailView(projectId) {
            const project = appData.projects.find(p => p.id === projectId);
            if (!project) return `<div class="p-6 text-center">प्रोजेक्ट नहीं मिला। <button onclick="switchTab('projects')" class="text-indigo-600 underline">वापस जाएं</button></div>`;

            const projectLogs = appData.logs.filter(l => l.projectId === projectId);
            const projectTasks = appData.tasks.filter(t => t.relatedProject === project.name);

            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <button onclick="switchTab('projects')" class="text-xs text-indigo-600 font-semibold flex items-center space-x-1 bg-indigo-50 px-3 py-1.5 rounded-xl">
                            <i class="fa-solid fa-arrow-left"></i><span>प्रोजेक्ट्स पर वापस</span>
                        </button>
                        <div class="space-x-2">
                            <button onclick="openResumeModal('${project.id}')" class="bg-indigo-600 text-white text-xs px-3 py-1.5 rounded-xl font-semibold shadow-sm"><i class="fa-solid fa-play mr-1"></i> Resume Summary</button>
                            <button onclick="openProjectModal('${project.id}')" class="bg-slate-200 text-slate-700 text-xs px-3 py-1.5 rounded-xl font-semibold">Edit</button>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                        <div>
                            <span class="text-xs font-semibold px-2.5 py-1 bg-indigo-100 text-indigo-700 rounded-full">${project.category}</span>
                            <h2 class="text-xl font-bold text-slate-800 mt-2">${project.name}</h2>
                            <p class="text-xs text-slate-600 mt-1">${project.description || 'विवरण नहीं है।'}</p>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <div><span class="text-slate-400 block">Prompt Tool</span><strong class="text-slate-700">${project.promptTool || 'N/A'}</strong></div>
                            <div><span class="text-slate-400 block">Code Tool</span><strong class="text-slate-700">${project.codeTool || 'N/A'}</strong></div>
                            <div><span class="text-slate-400 block">Host Platform</span><strong class="text-slate-700">${project.hostPlatform || 'N/A'}</strong></div>
                            <div><span class="text-slate-400 block">GitHub ID</span><strong class="text-slate-700">${project.githubId || 'N/A'}</strong></div>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="text-sm font-bold text-slate-800">Development Logs (${projectLogs.length})</h3>
                            <button onclick="openLogModal('${project.id}')" class="bg-emerald-600 text-white text-xs px-3 py-2 rounded-xl font-semibold shadow-sm"><i class="fa-solid fa-plus"></i> नया Log</button>
                        </div>
                        <div class="space-y-3">
                            ${projectLogs.length === 0 ? `<div class="bg-white p-6 rounded-2xl border text-center text-xs text-slate-400">कोई Log नहीं है।</div>` : projectLogs.map(l => `
                                <div class="bg-white rounded-2xl border p-4 shadow-sm space-y-2 text-xs">
                                    <div class="flex justify-between font-bold text-indigo-600"><span>${l.toolName}</span><span class="text-slate-400">${l.entryDate}</span></div>
                                    <p><strong>Prompt:</strong> ${l.promptUsed}</p>
                                    <p><strong>Result:</strong> ${l.currentResult}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTasksView() {
            const tasks = appData.tasks;
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-lg font-bold text-slate-800">Task Management (${tasks.length})</h2>
                        <button onclick="openTaskModal()" class="bg-indigo-600 text-white text-xs px-3 py-2 rounded-xl font-semibold shadow-sm"><i class="fa-solid fa-plus"></i> नया Task</button>
                    </div>
                    <div class="space-y-2.5">
                        ${tasks.length === 0 ? `<div class="text-center py-12 bg-white rounded-2xl border p-6 text-xs text-slate-400">कोई Task नहीं है।</div>` : tasks.map(t => `
                            <div class="bg-white p-3.5 rounded-2xl border flex items-center justify-between shadow-sm text-xs">
                                <div class="flex items-center space-x-3">
                                    <input type="checkbox" onchange="toggleTaskStatus('${t.id}')" ${t.status === 'Completed' ? 'checked' : ''} class="w-5 h-5 text-indigo-600 rounded">
                                    <div>
                                        <h4 class="font-bold text-slate-800 ${t.status === 'Completed' ? 'line-through text-slate-400' : ''}">${t.title}</h4>
                                        <p class="text-[10px] text-slate-500">${t.relatedProject || 'General'} • Due: ${t.dueDate || 'No Date'}</p>
                                    </div>
                                </div>
                                <button onclick="deleteTask('${t.id}')" class="text-slate-400 hover:text-rose-600"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderNotesView() {
            const notes = appData.notes;
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-lg font-bold text-slate-800">Quick Notes (${notes.length})</h2>
                        <button onclick="openNoteModal()" class="bg-indigo-600 text-white text-xs px-3 py-2 rounded-xl font-semibold shadow-sm"><i class="fa-solid fa-plus"></i> नया Note</button>
                    </div>
                    <div class="space-y-3">
                        ${notes.length === 0 ? `<div class="text-center py-12 bg-white rounded-2xl border p-6 text-xs text-slate-400">कोई Note नहीं है।</div>` : notes.map(n => `
                            <div class="bg-white p-4 rounded-2xl border shadow-sm space-y-2 text-xs">
                                <div class="flex justify-between font-bold text-slate-800"><span>${n.title}</span><span class="text-slate-400">${n.date}</span></div>
                                <p class="text-slate-600 whitespace-pre-wrap">${n.content}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderSettingsView() {
            return `
                <div class="space-y-6">
                    <h2 class="text-lg font-bold text-slate-800">Settings & Backup</h2>
                    <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-4 text-xs">
                        <h3 class="font-bold text-slate-700">Backup & Restore</h3>
                        <div class="flex space-x-3">
                            <button onclick="exportJSONBackup()" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl font-semibold">Backup Download</button>
                            <label class="flex-1 bg-slate-100 text-slate-700 py-2.5 rounded-xl font-semibold text-center cursor-pointer">Restore Backup<input type="file" accept=".json" onchange="importJSONBackup(event)" class="hidden"></label>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-4 text-xs">
                        <h3 class="font-bold text-slate-700">Demo Data</h3>

        // --- RESUME MODAL WITH NEW FIELDS ---
        async function openResumeModal(projectId) {

# PROJECT RESUME SUMMARY: ${project.name}

- **Description:** ${project.description || 'N/A'}
- **Status:** ${project.currentStatus} (${project.completionPercentage || 0}% Complete)
- **Prompt Tool:** ${project.promptTool || 'N/A'}
- **Code Tool:** ${project.codeTool || 'N/A'}
- **Host Platform:** ${project.hostPlatform || 'N/A'}
- **GitHub ID:** ${project.githubId || 'N/A'}
            `.trim();

            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">

        function copyResumeSummary() {
            const textarea = document.getElementById('resume-summary-text');
            textarea.select();
            document.execCommand('copy');
            showToast("Summary Clipboard में Copy हो गई!", "success");
        }

        // --- PROJECT MODAL WITH UPDATED FIELDS ---
        async function openProjectModal(projectId = null) {
            let project = {
                id: 'proj_' + Date.now(),
                name: '',
                category: 'AI Tools',
                description: '',
                currentStatus: 'In Progress',

                promptTool: 'ChatGPT',
                codeTool: 'Google Gemini',
                hostPlatform: 'Cloudflare Pages',
                githubId: ''
            };

            if (projectId) {
                await loadAppData();
                const found = appData.projects.find(p => p.id === projectId);
                if (found) project = found;
            }

            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl max-w-lg w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden text-xs">
                        <div class="bg-indigo-600 text-white p-4 flex justify-between items-center">
                            <h3 class="font-bold">${projectId ? 'Edit Project' : 'नया Project बनाएं'}</h3>
                            <button onclick="closeModal()" class="text-indigo-200 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onsubmit="saveProjectForm(event, '${project.id}')" class="p-4 overflow-y-auto flex-1 space-y-3">
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">Project Name *</label>
                                <input type="text" id="p-name" required value="${project.name}" class="w-full bg-slate-50 border rounded-xl p-2.5">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">Category</label>
                                    <select id="p-category" class="w-full bg-slate-50 border rounded-xl p-2.5">
                                        ${['Government Teaching Work', 'School Website', 'AI Chatbot', 'AI Tools', 'Website Development', 'App Development', 'Automation', 'YouTube Automation', 'RAS Preparation', 'Business Project', 'Personal Project', 'Other'].map(cat => `<option value="${cat}" ${project.category === cat ? 'selected' : ''}>${cat}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">Status</label>
                                    <select id="p-status" class="w-full bg-slate-50 border rounded-xl p-2.5">
                                        ${['Idea', 'Not Started', 'In Progress', 'On Hold', 'Needs Update', 'Testing', 'Completed', 'Archived'].map(st => `<option value="${st}" ${project.currentStatus === st ? 'selected' : ''}>${st}</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">Description</label>
                                <textarea id="p-desc" rows="2" class="w-full bg-slate-50 border rounded-xl p-2.5">${project.description || ''}</textarea>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">Prompt किससे बनवाया? (Prompt)</label>
                                    <input type="text" id="p-prompt" value="${project.promptTool || ''}" placeholder="e.g. ChatGPT / Gemini" class="w-full bg-slate-50 border rounded-xl p-2.5">
                                </div>
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">Code किससे लिखवाया? (Code)</label>
                                    <input type="text" id="p-code" value="${project.codeTool || ''}" placeholder="e.g. Gemini / Claude" class="w-full bg-slate-50 border rounded-xl p-2.5">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">कहाँ होस्ट किया? (Host)</label>
                                    <input type="text" id="p-host" value="${project.hostPlatform || ''}" placeholder="e.g. Cloudflare / Vercel" class="w-full bg-slate-50 border rounded-xl p-2.5">
                                </div>
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">GitHub ID</label>
                                    <input type="text" id="p-githubid" value="${project.githubId || ''}" placeholder="username/repo" class="w-full bg-slate-50 border rounded-xl p-2.5">
                                </div>
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">Completion % (${project.completionPercentage || 0}%)</label>
                                <input type="range" id="p-progress" min="0" max="100" value="${project.completionPercentage || 0}" class="w-full accent-indigo-600">
                            </div>
                            <div class="pt-3 flex space-x-2">
                                <button type="submit" class="flex-1 bg-indigo-600 text-white font-semibold py-2.5 rounded-xl">सेव करें</button>
                                <button type="button" onclick="closeModal()" class="bg-slate-200 text-slate-700 font-semibold px-4 py-2.5 rounded-xl">रद्द करें</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        async function saveProjectForm(event, id) {
            event.preventDefault();
            const projectData = {
                id: id,
                name: document.getElementById('p-name').value,
                category: document.getElementById('p-category').value,
                currentStatus: document.getElementById('p-status').value,
                description: document.getElementById('p-desc').value,
                promptTool: document.getElementById('p-prompt').value,
                codeTool: document.getElementById('p-code').value,
                hostPlatform: document.getElementById('p-host').value,
                githubId: document.getElementById('p-githubid').value,
                completionPercentage: parseInt(document.getElementById('p-progress').value) || 0,
                lastUpdated: new Date().toISOString().split('T')[0]
            };

            await dbPut('projects', projectData);
            closeModal();
            showToast("प्रोजेक्ट सफलतापर्वक सेव हो गया!", "success");
            refreshDataAndRender();
        }

        // --- LOG, TASK, NOTE MODALS & HELPERS ---
        function openLogModal(projectId) {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl max-w-lg w-full p-4 shadow-2xl text-xs space-y-3">
                        <div class="flex justify-between font-bold text-emerald-700"><h3>नया Development Log</h3><button onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
                        <form onsubmit="saveLogForm(event, '${projectId}')" class="space-y-3">
                            <input type="text" id="l-tool" placeholder="Tool Name (e.g. Gemini)" required class="w-full bg-slate-50 border rounded-xl p-2.5">
                            <textarea id="l-prompt" placeholder="Prompt Given..." required rows="2" class="w-full bg-slate-50 border rounded-xl p-2.5"></textarea>
                            <input type="text" id="l-result" placeholder="Current Result..." class="w-full bg-slate-50 border rounded-xl p-2.5">
                            <button type="submit" class="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-xl">Log सेव करें</button>
                        </form>
                    </div>
                </div>
            `;
        }

        async function saveLogForm(event, projectId) {
            event.preventDefault();

                id: 'log_' + Date.now(),
                projectId: projectId,
                toolName: document.getElementById('l-tool').value,
                promptUsed: document.getElementById('l-prompt').value,
                currentResult: document.getElementById('l-result').value,
                entryDate: new Date().toISOString().split('T')[0]
            };
            await dbPut('logs', logData);
            closeModal();
            showToast("Log सुरक्षित हो गया!", "success");
            switchTab('project-detail', projectId);
        }

        function openTaskModal() {
            const container = document.getElementById('modal-container');
            const projectOptions = appData.projects.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
            container.innerHTML = `
                <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl max-w-lg w-full p-4 shadow-2xl text-xs space-y-3">
                        <div class="flex justify-between font-bold text-indigo-700"><h3>नया Task</h3><button onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
                        <form onsubmit="saveTaskForm(event)" class="space-y-3">
                            <input type="text" id="t-title" placeholder="Task Title *" required class="w-full bg-slate-50 border rounded-xl p-2.5">
                            <select id="t-project" class="w-full bg-slate-50 border rounded-xl p-2.5"><option value="General">General</option>${projectOptions}</select>
                            <input type="date" id="t-due" value="${new Date().toISOString().split('T')[0]}" class="w-full bg-slate-50 border rounded-xl p-2.5">
                            <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-xl">Task सेव करें</button>
                        </form>
                    </div>
                </div>
            `;
        }

        async function saveTaskForm(event) {
            event.preventDefault();
            const taskData = {
                id: 'task_' + Date.now(),
                title: document.getElementById('t-title').value,
                relatedProject: document.getElementById('t-project').value,
                dueDate: document.getElementById('t-due').value,
                status: 'Not Started'
            };
            await dbPut('tasks', taskData);
            closeModal();
            showToast("Task जुड़ गया!", "success");
            refreshDataAndRender();
        }

        function openNoteModal() {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl max-w-lg w-full p-4 shadow-2xl text-xs space-y-3">
                        <div class="flex justify-between font-bold text-amber-700"><h3>नया Quick Note</h3><button onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
                        <form onsubmit="saveNoteForm(event)" class="space-y-3">
                            <input type="text" id="n-title" placeholder="Title *" required class="w-full bg-slate-50 border rounded-xl p-2.5">
                            <textarea id="n-content" placeholder="Content *" required rows="3" class="w-full bg-slate-50 border rounded-xl p-2.5"></textarea>
                            <button type="submit" class="w-full bg-amber-600 text-white font-semibold py-2.5 rounded-xl">Note सेव करें</button>
                        </form>
                    </div>
                </div>
            `;
        }

        async function saveNoteForm(event) {
            event.preventDefault();
            const noteData = {
                id: 'note_' + Date.now(),
                title: document.getElementById('n-title').value,
                content: document.getElementById('n-content').value,
                date: new Date().toISOString().split('T')[0]
            };
            await dbPut('notes', noteData);
            closeModal();
            showToast("Note सेव हो गया!", "success");
            refreshDataAndRender();
        }

        async function toggleTaskStatus(taskId) {
            const task = appData.tasks.find(t => t.id === taskId);
            if (task) {
                task.status = task.status === 'Completed' ? 'Not Started' : 'Completed';
                await dbPut('tasks', task);
                refreshDataAndRender();
            }
        }

        async function deleteTask(taskId) {
            if (confirm("डिलीट करें?")) {
                await dbDelete('tasks', taskId);
                refreshDataAndRender();
            }
        }

        async function loadDemoData() {
            const sampleProjects = [
                { id: 'p1', name: 'MGGS Khasoli School Website', category: 'School Website', currentStatus: 'In Progress', description: 'राजकीय विद्यालय पोर्टल', promptTool: 'ChatGPT', codeTool: 'Google Gemini', hostPlatform: 'Cloudflare Pages', githubId: 'nkkmnit/school-site', completionPercentage: 75 }
            ];
            for (let p of sampleProjects) await dbPut('projects', p);
            showToast("Demo Data लोड हो गया!", "success");
            refreshDataAndRender();
        }

        async function clearAllDataConfirmed() {
            if (confirm("सारा डेटा डिलीट करना चाहते हैं?")) {
                const tx = db.transaction(['projects', 'tasks', 'logs', 'notes'], 'readwrite');
                tx.objectStore('projects').clear();
                tx.objectStore('tasks').clear();
                tx.objectStore('logs').clear();
                tx.objectStore('notes').clear();
                refreshDataAndRender();
            }
        }

        function exportJSONBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", `personal-project-os-backup.json`);
            dl.click();
        }

        async function importJSONBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                const json = JSON.parse(e.target.result);
                if (json.projects) for (let p of json.projects) await dbPut('projects', p);
                if (json.tasks) for (let t of json.tasks) await dbPut('tasks', t);
                showToast("डेटा रिस्टोर हो गया!", "success");
                refreshDataAndRender();
            };
            reader.readAsText(file);
        }

        function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `bg-indigo-600 text-white text-xs px-4 py-3 rounded-xl shadow-lg`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function openGlobalSearch() {
            alert("Global search modal opened.");
        }

        window.onload = async function() {
            try {
                await initDB();
                await loadAppData();
                switchTab('home');
            } catch (err) {
                console.error("Init error", err);
            }
        };
    </script>
