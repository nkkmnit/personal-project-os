<!DOCTYPE html>
<html lang="hi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Project OS - AI Work Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <!-- PWA Manifest Link (Generated dynamically or inline blob) -->
    <link rel="manifest" id="manifest-placeholder">
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col justify-between select-none">

    <!-- Top Header -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="bg-white/10 p-2 rounded-xl text-indigo-100">
                <i class="fa-solid fa-brain text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-wide leading-tight">Personal Project OS</h1>
                <p class="text-xs text-indigo-200">AI Work Management System</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openGlobalSearch()" class="p-2 rounded-full hover:bg-white/10 transition text-indigo-100" title="Search">
                <i class="fa-solid fa-magnifying-glass text-lg"></i>
            </button>
            <button onclick="switchTab('settings')" class="p-2 rounded-full hover:bg-white/10 transition text-indigo-100" title="Settings">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Content View Area -->
    <main id="app-content" class="flex-1 overflow-y-auto pb-24 p-4 max-w-2xl mx-auto w-full">
        <!-- Dynamic Tabs Loaded via JS -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bg-white border-t border-slate-200 fixed bottom-0 left-0 right-0 z-40 shadow-lg max-w-2xl mx-auto">
        <div class="grid grid-cols-5 h-16 text-center text-xs font-medium text-slate-500">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center justify-center space-y-1 transition text-indigo-600">
                <i class="fa-solid fa-house text-lg"></i>
                <span>Home</span>
            </button>
            <button onclick="switchTab('projects')" id="nav-projects" class="flex flex-col items-center justify-center space-y-1 transition hover:text-indigo-600">
                <i class="fa-solid fa-diagram-project text-lg"></i>
                <span>Projects</span>
            </button>
            <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center justify-center space-y-1 transition hover:text-indigo-600">
                <i class="fa-solid fa-list-check text-lg"></i>
                <span>Tasks</span>
            </button>
            <button onclick="switchTab('notes')" id="nav-notes" class="flex flex-col items-center justify-center space-y-1 transition hover:text-indigo-600">
                <i class="fa-solid fa-note-sticky text-lg"></i>
                <span>Notes</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center justify-center space-y-1 transition hover:text-indigo-600">
                <i class="fa-solid fa-sliders text-lg"></i>
                <span>Settings</span>
            </button>
        </div>
    </nav>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-16 right-4 left-4 z-50 flex flex-col space-y-2 pointer-events-none max-w-md mx-auto"></div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <!-- JavaScript Application Logic -->
    <script>
        /* ==========================================================
           1. INDEXEDDB DATABASE LAYER (LOCAL-FIRST PERSISTENCE)
           ========================================================== */
        const DB_NAME = "PersonalProjectOS_DB";
        const DB_VERSION = 1;
        let db = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (event) => {
                    console.error("Database error: ", event.target.error);
                    reject(event.target.error);
                };
                request.onsuccess = (event) => {
                    db = event.target.result;
                    resolve(db);
                };
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains('projects')) {
                        database.createObjectStore('projects', { keyPath: 'id' });
                    }
                    if (!database.objectStoreNames.contains('tasks')) {
                        database.createObjectStore('tasks', { keyPath: 'id' });
                    }
                    if (!database.objectStoreNames.contains('logs')) {
                        database.createObjectStore('logs', { keyPath: 'id' });
                    }
                    if (!database.objectStoreNames.contains('notes')) {
                        database.createObjectStore('notes', { keyPath: 'id' });
                    }
                };
            });
        }

        // Generic DB Operations
        function dbGetAll(storeName) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readonly');
                const store = transaction.objectStore(storeName);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function dbPut(storeName, data) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.put(data);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function dbDelete(storeName, id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.delete(id);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        /* ==========================================================
           2. APP STATE & ROUTING
           ========================================================== */
        let currentTab = 'home';
        let appData = {
            projects: [],
            tasks: [],
            logs: [],
            notes: []
        };
        let activeProjectIdForDetail = null;

        async function loadAppData() {
            try {
                appData.projects = await dbGetAll('projects');
                appData.tasks = await dbGetAll('tasks');
                appData.logs = await dbGetAll('logs');
                appData.notes = await dbGetAll('notes');
            } catch (err) {
                console.error("Error loading app data", err);
            }
        }

        async function switchTab(tabName, projectId = null) {
            currentTab = tabName;
            if (projectId) activeProjectIdForDetail = projectId;

            // Highlight bottom nav
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('text-indigo-600', 'font-semibold');
                btn.classList.add('text-slate-500');
            });
            const activeNav = document.getElementById(`nav-${tabName}`);
            if (activeNav) {
                activeNav.classList.remove('text-slate-500');
                activeNav.classList.add('text-indigo-600', 'font-semibold');
            }

            await loadAppData();
            renderCurrentView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function refreshDataAndRender() {
            await loadAppData();
            renderCurrentView();
        }

        /* ==========================================================
           3. UI RENDERERS (VIEWS)
           ========================================================== */
        function renderCurrentView() {
            const container = document.getElementById('app-content');
            container.innerHTML = '';

            if (currentTab === 'home') {
                container.innerHTML = renderHomeView();
            } else if (currentTab === 'projects') {
                container.innerHTML = renderProjectsView();
            } else if (currentTab === 'project-detail') {
                container.innerHTML = renderProjectDetailView(activeProjectIdForDetail);
            } else if (currentTab === 'tasks') {
                container.innerHTML = renderTasksView();
            } else if (currentTab === 'notes') {
                container.innerHTML = renderNotesView();
            } else if (currentTab === 'settings') {
                container.innerHTML = renderSettingsView();
            }
        }

        // --- HOME / DASHBOARD VIEW ---
        function renderHomeView() {
            const projects = appData.projects;
            const tasks = appData.tasks;
            const todayStr = new Date().toISOString().split('T')[0];

            const totalProjects = projects.length;
            const activeProjects = projects.filter(p => p.currentStatus === 'In Progress').length;
            const pendingTasks = tasks.filter(t => t.status !== 'Completed').length;
            const completedTasks = tasks.filter(t => t.status === 'Completed').length;
            const overdueTasks = tasks.filter(t => t.dueDate && t.dueDate < todayStr && t.status !== 'Completed').length;
            const todaysTasks = tasks.filter(t => t.dueDate === todayStr && t.status !== 'Completed').length;
            const needsUpdateProjects = projects.filter(p => p.currentStatus === 'Needs Update' || p.currentStatus === 'On Hold').length;

            return `
                <div class="space-y-6">
                    <!-- Welcome Banner -->
                    <div class="bg-gradient-to-r from-indigo-500 to-violet-600 rounded-2xl p-5 text-white shadow-lg">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="bg-white/20 text-xs px-2.5 py-1 rounded-full font-medium">नमस्ते सर! 🙏</span>
                                <h2 class="text-xl font-bold mt-2">Personal Project OS</h2>
                                <p class="text-xs text-indigo-100 mt-1">आपके सभी AI Tools, Web Apps और Government Projects एक ही जगह सुरक्षित।</p>
                            </div>
                            <div class="bg-white/10 p-3 rounded-2xl">
                                <i class="fa-solid fa-terminal text-2xl text-indigo-100"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Action Buttons Grid -->
                    <div>
                        <h3 class="text-sm font-bold text-slate-600 mb-3 uppercase tracking-wider">Quick Actions (त्वरित कार्य)</h3>
                        <div class="grid grid-cols-3 gap-2.5">
                            <button onclick="openProjectModal()" class="bg-white hover:bg-indigo-50 border border-slate-200 p-3 rounded-xl text-center shadow-sm transition flex flex-col items-center justify-center">
                                <div class="bg-indigo-100 text-indigo-600 w-10 h-10 rounded-full flex items-center justify-center mb-1.5"><i class="fa-solid fa-plus text-sm"></i></div>
                                <span class="text-xs font-medium text-slate-700">नया Project</span>
                            </button>
                            <button onclick="openTaskModal()" class="bg-white hover:bg-emerald-50 border border-slate-200 p-3 rounded-xl text-center shadow-sm transition flex flex-col items-center justify-center">
                                <div class="bg-emerald-100 text-emerald-600 w-10 h-10 rounded-full flex items-center justify-center mb-1.5"><i class="fa-solid fa-list-check text-sm"></i></div>
                                <span class="text-xs font-medium text-slate-700">नया Task</span>
                            </button>
                            <button onclick="openNoteModal()" class="bg-white hover:bg-amber-50 border border-slate-200 p-3 rounded-xl text-center shadow-sm transition flex flex-col items-center justify-center">
                                <div class="bg-amber-100 text-amber-600 w-10 h-10 rounded-full flex items-center justify-center mb-1.5"><i class="fa-solid fa-note-sticky text-sm"></i></div>
                                <span class="text-xs font-medium text-slate-700">Quick Note</span>
                            </button>
                        </div>
                    </div>

                    <!-- Metric Cards Dashboard -->
                    <div>
                        <h3 class="text-sm font-bold text-slate-600 mb-3 uppercase tracking-wider">Dashboard Overview</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <div onclick="switchTab('projects')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-indigo-300 transition cursor-pointer">
                                <div class="flex justify-between items-center text-slate-500 mb-1">
                                    <span class="text-xs font-medium">Total Projects</span>
                                    <i class="fa-solid fa-folder-open text-indigo-500"></i>
                                </div>
                                <div class="text-2xl font-bold text-slate-800">${totalProjects}</div>
                            </div>
                            <div onclick="switchTab('projects')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-emerald-300 transition cursor-pointer">
                                <div class="flex justify-between items-center text-slate-500 mb-1">
                                    <span class="text-xs font-medium">Active Projects</span>
                                    <i class="fa-solid fa-bolt text-emerald-500"></i>
                                </div>
                                <div class="text-2xl font-bold text-emerald-600">${activeProjects}</div>
                            </div>
                            <div onclick="switchTab('tasks')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-blue-300 transition cursor-pointer">
                                <div class="flex justify-between items-center text-slate-500 mb-1">
                                    <span class="text-xs font-medium">Pending Tasks</span>
                                    <i class="fa-solid fa-clock text-blue-500"></i>
                                </div>
                                <div class="text-2xl font-bold text-blue-600">${pendingTasks}</div>
                            </div>
                            <div onclick="switchTab('tasks')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-green-300 transition cursor-pointer">
                                <div class="flex justify-between items-center text-slate-500 mb-1">
                                    <span class="text-xs font-medium">Completed Tasks</span>
                                    <i class="fa-solid fa-circle-check text-green-500"></i>
                                </div>
                                <div class="text-2xl font-bold text-green-600">${completedTasks}</div>
                            </div>
                            <div onclick="switchTab('tasks')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-amber-300 transition cursor-pointer">
                                <div class="flex justify-between items-center text-slate-500 mb-1">
                                    <span class="text-xs font-medium">Today's Tasks</span>
                                    <i class="fa-solid fa-calendar-day text-amber-500"></i>
                                </div>
                                <div class="text-2xl font-bold text-amber-600">${todaysTasks}</div>
                            </div>
                            <div onclick="switchTab('tasks')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-rose-300 transition cursor-pointer">
                                <div class="flex justify-between items-center text-slate-500 mb-1">
                                    <span class="text-xs font-medium">Overdue Tasks</span>
                                    <i class="fa-solid fa-triangle-exclamation text-rose-500"></i>
                                </div>
                                <div class="text-2xl font-bold text-rose-600">${overdueTasks}</div>
                            </div>
                        </div>
                    </div>

                    ${needsUpdateProjects > 0 ? `
                        <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <i class="fa-solid fa-triangle-exclamation text-amber-600 text-xl"></i>
                                <div>
                                    <h4 class="text-sm font-semibold text-amber-900">${needsUpdateProjects} Projects को Update चाहिए</h4>
                                    <p class="text-xs text-amber-700">कुछ प्रोजेक्ट्स Inactive या On Hold स्थिति में हैं।</p>
                                </div>
                            </div>
                            <button onclick="switchTab('projects')" class="bg-amber-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium shadow-sm">देखें</button>
                        </div>
                    ` : ''}

                    <!-- Today's Quick Tasks Section -->
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="text-sm font-bold text-slate-700">आज के मुख्य Tasks</h3>
                            <button onclick="switchTab('tasks')" class="text-xs text-indigo-600 font-semibold hover:underline">सभी देखें</button>
                        </div>
                        <div class="space-y-2">
                            ${tasks.filter(t => t.dueDate === todayStr && t.status !== 'Completed').length === 0 ? `
                                <p class="text-xs text-slate-400 italic py-2 text-center">आज कोई Pending Task नहीं है। शानदार!</p>
                            ` : tasks.filter(t => t.dueDate === todayStr && t.status !== 'Completed').map(t => `
                                <div class="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-100">
                                    <div class="flex items-center space-x-3">
                                        <input type="checkbox" onchange="toggleTaskStatus('${t.id}')" ${t.status === 'Completed' ? 'checked' : ''} class="w-4 h-4 text-indigo-600 rounded">
                                        <div>
                                            <p class="text-xs font-semibold text-slate-800">${t.title}</p>
                                            <span class="text-[10px] text-slate-500">${t.relatedProject || 'General'}</span>
                                        </div>
                                    </div>
                                    <span class="text-[10px] px-2 py-0.5 bg-rose-100 text-rose-700 rounded-full font-medium">${t.priority}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- PROJECTS VIEW ---
        function renderProjectsView() {
            const projects = appData.projects;
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="text-lg font-bold text-slate-800">My Projects (${projects.length})</h2>
                            <p class="text-xs text-slate-500">सभी ऐप्स, वेबसाइट्स और एआई प्रोजेक्ट्स का रिकॉर्ड</p>
                        </div>
                        <button onclick="openProjectModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-2 rounded-xl font-semibold shadow-sm flex items-center space-x-1.5 transition">
                            <i class="fa-solid fa-plus"></i>
                            <span>नया Project</span>
                        </button>
                    </div>

                    <!-- Search and Filters -->
                    <div class="flex space-x-2">
                        <div class="relative flex-1">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                            <input type="text" id="project-search" oninput="filterProjectsList()" placeholder="प्रोजेक्ट खोजें..." class="w-full pl-9 pr-3 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <select id="project-category-filter" onchange="filterProjectsList()" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="">सभी Categories</option>
                            <option value="Government Teaching Work">Govt Teaching</option>
                            <option value="School Website">School Website</option>
                            <option value="AI Chatbot">AI Chatbot</option>
                            <option value="AI Tools">AI Tools</option>
                            <option value="Website Development">Website Dev</option>
                            <option value="App Development">App Dev</option>
                            <option value="Automation">Automation</option>
                            <option value="YouTube Automation">YouTube Auto</option>
                            <option value="RAS Preparation">RAS Prep</option>
                            <option value="Business Project">Business</option>
                            <option value="Personal Project">Personal</option>
                        </select>
                    </div>

                    <!-- Projects List Container -->
                    <div id="projects-list-container" class="space-y-3">
                        ${projects.length === 0 ? `
                            <div class="text-center py-12 bg-white rounded-2xl border border-slate-200 p-6">
                                <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
                                <h3 class="text-sm font-bold text-slate-700">कोई प्रोजेक्ट नहीं मिला</h3>
                                <p class="text-xs text-slate-500 mt-1">शुरुआत करने के लिए ऊपर "+ नया Project" बटन दबाएं या Settings से Demo Data लोड करें।</p>
                                <button onclick="loadDemoData()" class="mt-4 bg-indigo-50 text-indigo-600 text-xs px-4 py-2 rounded-xl font-semibold hover:bg-indigo-100 transition">Sample Projects लोड करें</button>
                            </div>
                        ` : projects.map(p => renderProjectCard(p)).join('')}
                    </div>
                </div>
            `;
        }

        function renderProjectCard(p) {
            const statusColors = {
                'Idea': 'bg-purple-100 text-purple-700',
                'Not Started': 'bg-slate-100 text-slate-700',
                'In Progress': 'bg-emerald-100 text-emerald-700',
                'On Hold': 'bg-amber-100 text-amber-700',
                'Needs Update': 'bg-rose-100 text-rose-700',
                'Testing': 'bg-blue-100 text-blue-700',
                'Completed': 'bg-green-100 text-green-700',
                'Archived': 'bg-zinc-100 text-zinc-500'
            };

            return `
                <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm hover:shadow-md transition space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full ${statusColors[p.currentStatus] || 'bg-slate-100 text-slate-700'}">${p.currentStatus}</span>
                            <h3 onclick="switchTab('project-detail', '${p.id}')" class="text-base font-bold text-slate-800 mt-1 cursor-pointer hover:text-indigo-600">${p.name}</h3>
                            <p class="text-xs text-slate-500">${p.category}</p>
                        </div>
                        <div class="flex space-x-1">
                            <button onclick="openResumeModal('${p.id}')" class="bg-indigo-50 text-indigo-600 p-2 rounded-xl text-xs hover:bg-indigo-100 transition" title="Resume Project">
                                <i class="fa-solid fa-play"></i>
                            </button>
                            <button onclick="openProjectModal('${p.id}')" class="bg-slate-50 text-slate-600 p-2 rounded-xl text-xs hover:bg-slate-100 transition" title="Edit">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                        </div>
                    </div>

                    <p class="text-xs text-slate-600 line-clamp-2">${p.description || 'कोई विवरण उपलब्ध नहीं।'}</p>

                    <!-- Progress Bar -->
                    <div>
                        <div class="flex justify-between text-[10px] text-slate-500 mb-1 font-medium">
                            <span>Progress</span>
                            <span>${p.completionPercentage || 0}%</span>
                        </div>
                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                            <div class="bg-indigo-600 h-full rounded-full transition-all duration-300" style="width: ${p.completionPercentage || 0}%"></div>
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 text-xs text-slate-500">
                        <span><i class="fa-solid fa-tools mr-1"></i> ${p.lastTool || 'General'}</span>
                        <div class="space-x-2">
                            ${p.liveUrl ? `<a href="${p.liveUrl}" target="_blank" class="text-indigo-600 font-semibold hover:underline"><i class="fa-solid fa-globe mr-1"></i>Live</a>` : ''}
                            ${p.githubUrl ? `<a href="${p.githubUrl}" target="_blank" class="text-slate-700 font-semibold hover:underline"><i class="fa-brands fa-github mr-1"></i>Code</a>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function filterProjectsList() {
            const query = document.getElementById('project-search').value.toLowerCase();
            const category = document.getElementById('project-category-filter').value;
            const container = document.getElementById('projects-list-container');

            const filtered = appData.projects.filter(p => {
                const matchesQuery = p.name.toLowerCase().includes(query) || (p.description && p.description.toLowerCase().includes(query));
                const matchesCategory = category === '' || p.category === category;
                return matchesQuery && matchesCategory;
            });

            if (filtered.length === 0) {

        function runGlobalSearch(query) {
            const resContainer = document.getElementById('global-search-results');
            if (!query.trim()) {
                resContainer.innerHTML = `<p class="text-slate-400 text-center py-4">खोजने के लिए टाइप करें...</p>`;
                return;
            }

            const q = query.toLowerCase();
            const matchedProjects = appData.projects.filter(p => p.name.toLowerCase().includes(q) || (p.description && p.description.toLowerCase().includes(q)));
            const matchedTasks = appData.tasks.filter(t => t.title.toLowerCase().includes(q));
            const matchedNotes = appData.notes.filter(n => n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q));

            let html = '';
            if (matchedProjects.length > 0) {
                html += `<h4 class="font-bold text-indigo-600 mb-1">Projects</h4>`;
                html += matchedProjects.map(p => `<div onclick="closeModal(); switchTab('project-detail', '${p.id}')" class="p-2 bg-slate-50 rounded-xl cursor-pointer hover:bg-indigo-50 font-semibold">${p.name}</div>`).join('');
            }
            if (matchedTasks.length > 0) {
                html += `<h4 class="font-bold text-emerald-600 mt-3 mb-1">Tasks</h4>`;
                html += matchedTasks.map(t => `<div class="p-2 bg-slate-50 rounded-xl">${t.title} (${t.relatedProject})</div>`).join('');
            }
            if (matchedNotes.length > 0) {
                html += `<h4 class="font-bold text-amber-600 mt-3 mb-1">Notes</h4>`;
                html += matchedNotes.map(n => `<div class="p-2 bg-slate-50 rounded-xl">${n.title}</div>`).join('');
            }

            resContainer.innerHTML = html || `<p class="text-slate-400 text-center py-4">कोई परिणाम नहीं मिला।</p>`;
        }

        // --- BACKUP & RESTORE FUNCTIONS ---
        async function exportJSONBackup() {
            await loadAppData();
            const backupObj = {
                version: "1.0.0",
                exportDate: new Date().toISOString(),
                projects: appData.projects,
                tasks: appData.tasks,
                logs: appData.logs,
                notes: appData.notes
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupObj, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            const dateStr = new Date().toISOString().split('T')[0];
            downloadAnchor.setAttribute("download", `personal-project-os-backup-${dateStr}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("बैकअप JSON फाइल सफलतापर्वक डाउनलोड हो गई!", "success");
        }

        async function importJSONBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const json = JSON.parse(e.target.result);
                    if (!json.projects || !json.tasks) {
                        alert("अमान्य बैकअप फाइल! (Invalid JSON structure)");
                        return;
                    }

                    if (confirm("बैकअप रिस्टोर करने से वर्तमान डेटा ओवरराइट हो सकता है। क्या आप आगे बढ़ना चाहते हैं?")) {
                        for (let p of json.projects) await dbPut('projects', p);
                        for (let t of json.tasks) await dbPut('tasks', t);
                        for (let l of (json.logs || [])) await dbPut('logs', l);
                        for (let n of (json.notes || [])) await dbPut('notes', n);

                        showToast("डेटा सफलतापर्वक Restore हो गया!", "success");
                        refreshDataAndRender();
                    }
                } catch (err) {
                    alert("फाइल पढ़ने में त्रुटि: " + err.message);
                }
            };
            reader.readAsText(file);
        }

        /* ==========================================================
           5. PWA SERVICE WORKER & MANIFEST GENERATION
           ========================================================== */
        function setupPWA() {
            // Dynamic Web App Manifest
            const manifest = {
                name: "Personal Project OS",
                short_name: "ProjectOS",
                start_url: "./index.html",
                display: "standalone",
                background_color: "#f8fafc",
                theme_color: "#4f46e5",
                icons: [
                    { src: "https://placehold.co/192x192/4f46e5/ffffff?text=OS", sizes: "192x192", type: "image/png" },
                    { src: "https://placehold.co/512x512/4f46e5/ffffff?text=OS", sizes: "512x512", type: "image/png" }
                ]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));

            // Service Worker Registration
            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', (e) => {
                        e.waitUntil(caches.open('project-os-v1').then((cache) => cache.addAll(['./index.html'])));
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(caches.match(e.request).then((response) => response || fetch(e.request)));
                    });
                `;
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(swBlob))
                    .then(() => console.log("Service Worker Registered successfully"))
                    .catch(err => console.log("Service Worker Registration failed", err));
            }
        }

        // --- INIT APP ON LOAD ---
        window.onload = async function() {
            setupPWA();
            try {
                await initDB();

                // If first time and empty, suggest loading demo data or show home
                switchTab('home');
            } catch (err) {
                console.error("Initialization error: ", err);
                showToast("डेटाबेस लोड करने में समस्या आई।", "error");
            }
        };
